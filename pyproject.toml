[project]
name = "vishal-mri"
version = "0.1.0"
description = "Phase 1: report-conditioned native voxel-flow MRI generation"
readme = "README.md"
authors = [
    { name = "raid-97", email = "iitj.ac.in" }
]
requires-python = ">=3.11"
dependencies = [
    "filelock>=4.0.10",
    "fsspec[http]>=2026.9.0",
    "huggingface-hub>=0.36,<1",
    "langdetect>=1.0.9",
    "lpips>=0.1.4",
    "matplotlib>=3.11.2",
    "nibabel>=5.4.2",
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "open-clip-torch>=3",
    "pandas>=3.0.6",
    "peft>=0.21.2",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "simpleitk>=2.5.6",
    "streamlit>=1.66,<2",
    "torch>=2.14.1",
    "torchvision>=0.21.0",
    "tqdm>=4.70.1",
    "transformers>=4.45,<5",
    "triton",
]

[tool.pytest.ini_options]
cache_dir = "cache/pytest"
testpaths = ["code/tests"]
pythonpath = ["code", "code/tests"]
markers = ["cuda: native CUDA checks (set VOXEL_CUDA_TESTS=1)"]
